name: CI acceptance

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-acceptance-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  acceptance:
    name: acceptance (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-24.04
          - windows-2022
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt
      - name: Install pinned test dependencies
        run: python -m pip install -r requirements-dev.txt
      - name: Run every CI check
        run: python scripts/check.py

  lua-static:
    name: Lua static analysis
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - name: Install pinned Luacheck
        run: |
          sudo apt-get update
          sudo apt-get install -y lua5.4 liblua5.4-dev luarocks
          sudo luarocks --lua-version=5.4 install luacheck 1.2.0-1
      - name: Check game-side Lua
        run: luacheck mod

  voice:
    name: Speech-to-text on the voice fixtures
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: '3.12'
      - name: Install the pinned voice packages
        run: python -m pip install -r requirements-voice.txt
      - name: Download and verify the pinned speech model
        run: python -m companion.voice --install
      - name: Transcribe the fixtures with faster-whisper on the CPU
        run: FARMHAND_WHISPER_DIR="$HOME/FS25Farmhand/whisper-base.en" python -m unittest -v tests.test_voice

  dependency-audit:
    name: Python dependency audit
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: '3.12'
      - name: Audit pinned Python dependencies
        run: |
          python -m pip install pip-audit==2.10.1
          python -m pip_audit -r requirements-dev.txt --strict
          python -m pip_audit -r requirements-voice.txt --strict

  package-probe:
    name: Build exact FS25 mod artifact
    needs:
      - acceptance
      - lua-static
      - voice
      - dependency-audit
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: '3.12'
      - name: Build and validate exact install folder
        run: python scripts/package_probe.py --build dist/FS25_Farmhand
      - name: Upload qualified mod
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: FS25_Farmhand-${{ github.sha }}
          path: dist/
          if-no-files-found: error
          retention-days: 14

  package:
    name: Windows package, install and uninstall (qualification only)
    needs:
      - acceptance
      - voice
    runs-on: windows-2022
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: '3.12'
      - name: Build the package with its own embedded Python
        run: python scripts/package_probe.py --build-package dist/FS25Farmhand-qualification
      - name: The embedded runtime imports everything on its own
        run: dist\FS25Farmhand-qualification\runtime\python.exe -c "import companion.service, companion.setup, companion.voice, companion.ai, faster_whisper, sounddevice, jsonschema; print('ok')"
      - name: Install into a temporary profile, check, uninstall
        run: python -m unittest -v tests.test_setup.WindowsInstallTests
        env:
          FARMHAND_PACKAGE: dist\FS25Farmhand-qualification
      - name: Upload the qualification package (not a release)
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: FS25Farmhand-qualification-${{ github.sha }}
          path: dist/FS25Farmhand-qualification/
          if-no-files-found: error
          retention-days: 14
